services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/typeform.db
      CORS_ORIGINS: "[]"
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  gateway:
    image: caddy:2
    profiles: ["hosting"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
